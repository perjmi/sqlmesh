services:
  reference_db:
    image: postgres:16
    environment:
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlmesh"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  candidate_db:
    image: postgres:16
    environment:
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlmesh"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  reference:
    image: ${REFERENCE_SQLMESH_IMAGE:-randomgraphs-sqlmesh}
    working_dir: /workspace/examples/randomgraphs
    environment:
      POSTGRES_HOST: reference_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SQLMESH_CACHE_DIR: /tmp/sqlmesh-cache
      PYTHONDONTWRITEBYTECODE: 1
    depends_on:
      reference_db:
        condition: service_healthy
    volumes:
      - .:/workspace/examples/randomgraphs:ro
    tmpfs:
      - /tmp

  candidate:
    image: ${CANDIDATE_SQLMESH_IMAGE:-randomgraphs-sqlmesh}
    working_dir: /workspace/examples/randomgraphs
    environment:
      POSTGRES_HOST: candidate_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SQLMESH_CACHE_DIR: /tmp/sqlmesh-cache
      PYTHONDONTWRITEBYTECODE: 1
      SQLMESH__PLANNER__MODE: ${CANDIDATE_PLANNER_MODE:-shadow}
      SQLMESH__PLANNER__STREAMING_WORKERS: ${STREAMING_WORKERS:-2}
      SQLMESH__PLANNER__STREAMING_WORKER_MAX_TASKS: ${STREAMING_WORKER_MAX_TASKS:-25}
      MAX_FORK_WORKERS: ${STREAMING_WORKERS:-2}
    depends_on:
      candidate_db:
        condition: service_healthy
    volumes:
      - .:/workspace/examples/randomgraphs:ro
    tmpfs:
      - /tmp
