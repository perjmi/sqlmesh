services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlmesh"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sqlmesh:
    build:
      context: ../..
      dockerfile: examples/randomgraphs/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace/examples/randomgraphs

volumes:
  postgres_data:
