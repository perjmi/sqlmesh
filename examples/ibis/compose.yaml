services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlmesh"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sqlmesh:
    build:
      context: ../..
      dockerfile: examples/ibis/Dockerfile
    environment:
      SQLMESH_GATEWAY: postgres
      SQLMESH_DIALECT: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sqlmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      IBIS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sqlmesh
      IBIS_CATALOG: ""
      IBIS_DATABASE: ibis
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace/examples/ibis

volumes:
  postgres_data:
