# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqlmesh-personal-tests
  namespace: ws-tryg360-next-development
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqlmesh-personal-runner
  namespace: ws-tryg360-next-development
data:
  config.toml: |
    concurrent = 1
    check_interval = 3
    shutdown_timeout = 30

    [[runners]]
      name = "sqlmesh-personal-k8s"
      url = "https://gitlab.devops.prdroot.net"
      token = "__RUNNER_TOKEN__"
      executor = "docker"
      builds_dir = "/builds"
      output_limit = 16384
      environment = ["FF_NETWORK_PER_BUILD=true"]
      [runners.docker]
        host = "tcp://localhost:2375"
        tls_verify = false
        image = "mirror.gcr.io/library/docker:27.5.1-cli"
        privileged = false
        services_privileged = true
        allowed_privileged_services = ["mirror.gcr.io/library/docker:27.5.1-dind"]
        allowed_images = ["mirror.gcr.io/library/docker:27.5.1-cli"]
        allowed_services = ["mirror.gcr.io/library/docker:27.5.1-dind"]
        pull_policy = "if-not-present"
        wait_for_services_timeout = 120
        volumes = ["/builds"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlmesh-personal-runner
  namespace: ws-tryg360-next-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlmesh-personal-runner
  template:
    metadata:
      labels:
        app: sqlmesh-personal-runner
    spec:
      # Runner jobs use Docker inside this pod and need no Kubernetes API access.
      serviceAccountName: sqlmesh-personal-tests
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: runner
          image: mirror.gcr.io/gitlab/gitlab-runner:alpine-v19.2.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              mkdir -p /runner-config
              awk 'BEGIN {getline token < "/runner-secret/token"} {gsub(/__RUNNER_TOKEN__/, token); print}' \
                /runner-template/config.toml > /runner-config/config.toml
              attempts=0
              until wget -q -O - http://localhost:2375/_ping >/dev/null; do
                attempts=$((attempts + 1))
                [ "$attempts" -lt 120 ] || exit 1
                sleep 1
              done
              exec gitlab-runner run --config /runner-config/config.toml --working-directory /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: template
              mountPath: /runner-template
              readOnly: true
            - name: secret
              mountPath: /runner-secret
              readOnly: true
            - name: config
              mountPath: /runner-config
        - name: docker
          image: mirror.gcr.io/library/docker:27.5.1-dind
          args: ["--tls=false", "--registry-mirror=https://mirror.gcr.io"]
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "8"
              memory: 16Gi
              ephemeral-storage: 40Gi
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: template
          configMap:
            name: sqlmesh-personal-runner
        - name: secret
          secret:
            secretName: sqlmesh-personal-runner
        - name: config
          emptyDir: {}
        - name: docker-storage
          emptyDir:
            sizeLimit: 40Gi
